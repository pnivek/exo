# exo-vllm disaggregated inference — Sparkly (prefill head)
#
# Single Spark vLLM prefill + Mac MLX decode.
# Sparkly runs exo with VllmBuilder → in-process vLLM engine → KV streaming to Mac.
# Mac runs exo natively with MLX for decode.
#
# Image: exo-vllm (exo-spark + vLLM + FlashInfer, Python 3.13)
# Deploy via Komodo on Sparkly (192.168.0.172)

services:
  exo:
    image: 192.168.0.181:5000/pnivek/exo-vllm:latest
    container_name: exo_vllm_sparkly
    restart: "no"
    privileged: true
    network_mode: host
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    devices:
      - /dev/infiniband:/dev/infiniband
    volumes:
      - /root/.config/exo:/root/.config/exo
      - /root/.cache/huggingface:/root/.cache/huggingface
      - /root/.cache/vllm:/root/.cache/vllm
      - /root/.cache/flashinfer:/root/.cache/flashinfer
      - /root/.triton:/root/.triton
      - /root/.local/share/exo/models:/root/.local/share/exo/models
      - /etc/komodo/repos/eugr/spark-vllm-docker:/workspace/spark-vllm-docker:ro
      - /dev/infiniband:/dev/infiniband
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - EXO_MODELS_PATH=/root/.local/share/exo/models
      - VLLM_ENABLE_V1_MULTIPROCESSING=0
      - VLLM_KV_CACHE_LAYOUT=NHD
      - FASTSAFETENSORS_NOGDS=1
      - MLX_CUDA_GRAPH_CACHE_SIZE=3000
      - NCCL_IGNORE_CPU_AFFINITY=1
      - NCCL_SOCKET_IFNAME=enp1s0f0np0
      - NCCL_IB_HCA=rocep1s0f0
      - NCCL_IB_DISABLE=0
      - NCCL_IB_GID_INDEX=3
      - NCCL_DEBUG=WARN
      - GLOO_SOCKET_IFNAME=enp1s0f0np0
      - LISTEN_PORT=${LISTEN_PORT}
      - DIAL_ADDR=${DIAL_ADDR}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cd /workspace/spark-vllm-docker/mods/fix-qwen3.5-chat-template && bash run.sh || true
        exec python3 -m exo --listen-port $LISTEN_PORT --dial $DIAL_ADDR -v
